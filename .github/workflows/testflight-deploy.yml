name: Deploy to TestFlight

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for this build'
        required: false
        default: 'Automated TestFlight build'

jobs:
  deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      id-token: write # mint the OIDC token traded for the build role
      contents: write # push the release tag

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch app config from SSM and write secrets.xcconfig
        run: |
          set -euo pipefail

          SPOTIFY_CLIENT_ID=$(aws ssm get-parameter --name /xomify/spotify/CLIENT_ID --with-decryption --query 'Parameter.Value' --output text)
          SPOTIFY_CLIENT_SECRET=$(aws ssm get-parameter --name /xomify/spotify/CLIENT_SECRET --with-decryption --query 'Parameter.Value' --output text)
          XOMIFY_API_ID=$(aws ssm get-parameter --name /xomify/api/API_ID --with-decryption --query 'Parameter.Value' --output text)
          XOMIFY_API_TOKEN=$(aws ssm get-parameter --name /xomify/api/API_AUTH_TOKEN --with-decryption --query 'Parameter.Value' --output text)

          echo "::add-mask::$SPOTIFY_CLIENT_ID"
          echo "::add-mask::$SPOTIFY_CLIENT_SECRET"
          echo "::add-mask::$XOMIFY_API_ID"
          echo "::add-mask::$XOMIFY_API_TOKEN"

          cat > secrets.xcconfig << XCCONFIG
          SPOTIFY_CLIENT_ID = $SPOTIFY_CLIENT_ID
          SPOTIFY_CLIENT_SECRET = $SPOTIFY_CLIENT_SECRET
          XOMIFY_API_ID = $XOMIFY_API_ID
          XOMIFY_API_TOKEN = $XOMIFY_API_TOKEN
          XCCONFIG

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_P8" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8

      - name: Compute version and build number
        id: version
        run: |
          # Marketing version is the SemVer in project.pbxproj — the canonical
          # source of truth. Bump it via scripts/bump-version.sh when shipping
          # a feat (minor) / fix (patch) / epic (major). Build number is a
          # monotonic timestamp so TestFlight always accepts a new upload even
          # when marketing version is unchanged.
          PBXPROJ="Xomify-iOS.xcodeproj/project.pbxproj"
          MARKETING_VERSION=$(grep -m1 'MARKETING_VERSION' "$PBXPROJ" | sed -E 's/.*MARKETING_VERSION = ([^;]+);.*/\1/' | tr -d ' ')
          if [ -z "$MARKETING_VERSION" ]; then
            echo "Could not read MARKETING_VERSION from $PBXPROJ" >&2
            exit 1
          fi
          BUILD_NUMBER=$(date +%Y%m%d%H%M)
          echo "marketing=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Marketing version: $MARKETING_VERSION"
          echo "Build number: $BUILD_NUMBER"

          # Surface an unchanged marketing version. A rebuild of the same
          # version is legitimate, so this warns rather than fails -- but
          # 1.18.0 silently absorbed two features and a dozen merges before
          # anyone noticed every TestFlight build looked identical.
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ "$LAST_TAG" = "v$MARKETING_VERSION" ]; then
            echo "::warning title=Marketing version unchanged::Still $MARKETING_VERSION, already released as $LAST_TAG. Run scripts/bump-version.sh <feat|fix|epic> if this build ships anything new."
          fi
          {
            echo "### TestFlight $MARKETING_VERSION ($BUILD_NUMBER)"
            [ "$LAST_TAG" = "v$MARKETING_VERSION" ] && echo "⚠️ Marketing version unchanged since \`$LAST_TAG\` — testers will not see a new version number."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Python deps for ASC API
        run: pip3 install --quiet --break-system-packages PyJWT cryptography requests

      - name: Free Apple Development cert slot (revoke oldest if at limit)
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          python3 <<'PY'
          import os, sys, time, jwt, requests
          key_id = os.environ["ASC_API_KEY_ID"]
          issuer = os.environ["ASC_API_ISSUER_ID"]
          with open(os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8")) as f:
              pk = f.read()
          def tok():
              return jwt.encode(
                  {"iss": issuer, "iat": int(time.time()), "exp": int(time.time()) + 1200, "aud": "appstoreconnect-v1"},
                  pk, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"})
          h = {"Authorization": f"Bearer {tok()}"}
          base = "https://api.appstoreconnect.apple.com/v1"
          r = requests.get(f"{base}/certificates", headers=h, params={"limit": 200})
          r.raise_for_status()
          all_certs = r.json()["data"]
          dev = [c for c in all_certs if c["attributes"].get("certificateType") in ("IOS_DEVELOPMENT", "DEVELOPMENT")]
          dev.sort(key=lambda c: c["attributes"].get("expirationDate", ""))
          print(f"Found {len(dev)} development cert(s):")
          for c in dev:
              print(f"  {c['id']} type={c['attributes'].get('certificateType')} name={c['attributes'].get('name')} expires={c['attributes'].get('expirationDate')}")
          keep_n = 1
          if len(dev) > keep_n:
              for c in dev[:len(dev) - keep_n]:
                  print(f"Revoking {c['id']} ({c['attributes'].get('name')})")
                  rr = requests.delete(f"{base}/certificates/{c['id']}", headers=h)
                  if rr.status_code >= 400:
                      print(f"!! Failed to revoke {c['id']}: {rr.status_code} {rr.text}", file=sys.stderr)
                  else:
                      print(f"Revoked {c['id']}")
          else:
              print("Under limit, no revocation needed")
          PY

      - name: Archive
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Xomify-iOS.xcodeproj \
            -scheme Xomify-iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Xomify-iOS.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" \
            MARKETING_VERSION=${{ steps.version.outputs.marketing }} \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }}

      - name: Create ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Xomify-iOS.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"

      - name: Upload to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          IPA_PATH=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"

      - name: Assign build to TestFlight groups
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          BUNDLE_ID: com.Xomware.Xomify
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          BETA_GROUPS: 'Beta,Beta Friends'
        run: |
          python3 <<'PY'
          import os, sys, time
          import jwt, requests

          key_id = os.environ["ASC_API_KEY_ID"]
          issuer = os.environ["ASC_API_ISSUER_ID"]
          bundle_id = os.environ["BUNDLE_ID"]
          build_num = os.environ["BUILD_NUMBER"]
          groups = [g.strip() for g in os.environ["BETA_GROUPS"].split(",") if g.strip()]

          with open(os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8")) as f:
              private_key = f.read()

          def make_token():
              return jwt.encode(
                  {"iss": issuer, "iat": int(time.time()), "exp": int(time.time()) + 1200, "aud": "appstoreconnect-v1"},
                  private_key,
                  algorithm="ES256",
                  headers={"kid": key_id, "typ": "JWT"},
              )

          base = "https://api.appstoreconnect.apple.com/v1"
          headers = {"Authorization": f"Bearer {make_token()}"}

          r = requests.get(f"{base}/apps", headers=headers, params={"filter[bundleId]": bundle_id})
          r.raise_for_status()
          apps = r.json()["data"]
          if not apps:
              print(f"No app found for bundle {bundle_id}", file=sys.stderr)
              sys.exit(1)
          app_id = apps[0]["id"]
          print(f"App ID: {app_id}")

          build_id = None
          for attempt in range(30):
              r = requests.get(
                  f"{base}/builds",
                  headers=headers,
                  params={
                      "filter[app]": app_id,
                      "filter[version]": build_num,
                      "sort": "-uploadedDate",
                      "limit": 1,
                  },
              )
              r.raise_for_status()
              data = r.json()["data"]
              if data:
                  build_id = data[0]["id"]
                  state = data[0]["attributes"].get("processingState", "?")
                  print(f"Build {build_num} found: id={build_id} state={state}")
                  break
              print(f"Build {build_num} not yet visible, retry {attempt + 1}/30")
              time.sleep(20)

          if not build_id:
              print("Build never appeared in ASC API", file=sys.stderr)
              sys.exit(1)

          for name in groups:
              r = requests.get(
                  f"{base}/betaGroups",
                  headers=headers,
                  params={"filter[app]": app_id, "filter[name]": name},
              )
              r.raise_for_status()
              data = r.json()["data"]
              if data:
                  group = data[0]
              else:
                  # Auto-create external beta group if missing. Testers still need
                  # to be added in ASC UI; this just unblocks build assignment.
                  print(f"Beta group {name!r} not found — creating as external group")
                  cr = requests.post(
                      f"{base}/betaGroups",
                      headers={**headers, "Content-Type": "application/json"},
                      json={
                          "data": {
                              "type": "betaGroups",
                              "attributes": {
                                  "name": name,
                                  "publicLinkEnabled": False,
                                  "publicLinkLimitEnabled": False,
                              },
                              "relationships": {
                                  "app": {"data": {"type": "apps", "id": app_id}},
                              },
                          }
                      },
                  )
                  if cr.status_code >= 400:
                      print(f"!! Failed to create group {name!r}: {cr.status_code} {cr.text}", file=sys.stderr)
                      continue
                  group = cr.json()["data"]
                  print(f"Created group {name!r} ({group['id']}) — add testers in App Store Connect")
              group_id = group["id"]
              if group["attributes"].get("isInternalGroup"):
                  print(f"Group {name!r} is internal — auto-receives all builds, skipping manual assignment")
                  continue
              r = requests.post(
                  f"{base}/betaGroups/{group_id}/relationships/builds",
                  headers={**headers, "Content-Type": "application/json"},
                  json={"data": [{"type": "builds", "id": build_id}]},
              )
              if r.status_code >= 400:
                  print(f"!! Failed to assign to {name}: {r.status_code} {r.text}", file=sys.stderr)
                  sys.exit(1)
              print(f"Assigned build to group {name!r} ({group_id})")
          PY

      # Tags the commit a marketing version actually shipped from. Without
      # this the version guard above has nothing to compare against, which is
      # how 1.18.0 absorbed two features and a dozen merges unnoticed.
      - name: Tag the release
        run: |
          TAG="v${{ steps.version.outputs.marketing }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already tagged — same marketing version shipped again."
            exit 0
          fi
          git tag -a "$TAG" -m "TestFlight ${{ steps.version.outputs.marketing }} (${{ steps.version.outputs.build }})"
          git push origin "$TAG"

      - name: Cleanup API key
        if: always()
        run: rm -f ~/.appstoreconnect/private_keys/*.p8
