name: Deploy to TestFlight

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      testflight_notes:
        description: 'Release notes for TestFlight'
        required: false
        default: 'Automated build'

env:
  XCODE_VERSION: '16.1'

jobs:
  deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Set up secrets config
        run: |
          cat > Xomify-iOS/secrets.xcconfig << XCCONFIG
          SPOTIFY_CLIENT_ID = ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REDIRECT_URI = ${{ secrets.SPOTIFY_REDIRECT_URI }}
          XCCONFIG

      - name: Import Code Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Download Provisioning Profiles
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" | base64 -D > ~/Library/MobileDevice/Provisioning\ Profiles/xomify-ios.mobileprovision
          
      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Xomify-iOS.xcodeproj \
            -scheme Xomify-iOS \
            -destination generic/platform=iOS \
            -archivePath "build/Xomify-iOS.xcarchive" \
            -configuration Release \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="${{ secrets.APPLE_CODE_SIGN_IDENTITY }}" \
            PROVISIONING_PROFILE="${{ secrets.APPLE_PROVISIONING_PROFILE_UUID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            | xcpretty || true

      - name: Create ExportOptions.plist
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>upload</string>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "build/Xomify-iOS.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "build/" \
            | xcpretty || true

      - name: Upload to TestFlight
        run: |
          xcrun altool \
            --upload-app \
            --file "build/Xomify-iOS.ipa" \
            --username "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_APP_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}"

      - name: Create Release Notes
        if: success()
        run: |
          cat > release-notes.txt << EOF
          Release: Automated TestFlight Build
          Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Commit: ${{ github.sha }}
          Commit Message: ${{ github.event.head_commit.message }}
          Build Number: ${{ github.run_number }}
          Release Notes: ${{ github.event.inputs.testflight_notes }}
          EOF

      - name: Upload Release Notes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.txt
          retention-days: 90

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "Xomify iOS TestFlight Deployment ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Xomify iOS TestFlight Deployment*\nStatus: `${{ job.status }}`\nBuild: #${{ github.run_number }}\nCommit: `${{ github.sha }}`"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
